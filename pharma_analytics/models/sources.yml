version: 2

sources:
  - name: raw
    schema: raw
    description: Raw data from figshare
    tables:
      - name: laboratory
        description: Laboratory batch and quality data (1005 batches, 55 columns)
        columns:
          - name: batch
            description: Batch identifier
          - name: code
            description: Product code
          - name: strength
            description: Product strength
      - name: process_timeseries
        description: Consolidated per-equipment process time-series (25 press lines)
        columns:
          - name: raw_data
            description: JSON document — see stg_process_timeseries.sql for parsed fields
          - name: loaded_at
            description: Row insert timestamp
