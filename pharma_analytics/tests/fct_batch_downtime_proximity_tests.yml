version: 2

models:
  - name: fct_batch_downtime_proximity
    columns:
      - name: batch_id
        tests:
          - unique
          - not_null

      - name: downtime_proximity_bucket
        tests:
          - accepted_values:
              values: ['within_2hrs', '2_to_24hrs', '24hrs_plus_baseline', 'no_prior_downtime']

      - name: quality_score
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
